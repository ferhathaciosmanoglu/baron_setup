name: BARON Windows Release

on:
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable

      - name: Bagimliliklari kur
        run: npm ci

      - name: Windows surumunu derle ve yayinla
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: baron-v__VERSION__
          releaseName: BARON v__VERSION__
          releaseBody: |
            BARON Ders Programı v__VERSION__

            Windows kurulum dosyası ve otomatik güncelleme paketleri.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
