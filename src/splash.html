<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BARON açılıyor</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Segoe UI,Arial,sans-serif;background:transparent}
body{display:grid;place-items:center}.panel{width:100%;height:100%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at top,#182b4c 0,#0b1425 55%,#07101d 100%);color:#fff;border:1px solid rgba(223,183,73,.35)}
.logo{width:120px;height:120px;border-radius:30px;display:grid;place-items:center;font-size:68px;font-weight:900;color:#07101d;background:linear-gradient(145deg,#f3d276,#bd861d);box-shadow:0 24px 60px rgba(0,0,0,.45)}
h1{margin:22px 0 6px;font-size:32px;letter-spacing:4px}.sub{color:#b8c4d7;font-size:14px}.loader{width:240px;height:4px;margin:28px auto 0;background:rgba(255,255,255,.12);border-radius:10px;overflow:hidden}.loader::after{content:"";display:block;width:40%;height:100%;background:#dfb749;border-radius:10px;animation:load 1.2s ease-in-out infinite}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(350%)}}
</style>
</head>
<body><div class="panel"><div><div class="logo">B</div><h1>BARON</h1><div class="sub">Ders programı çalışma alanı hazırlanıyor</div><div class="loader"></div></div></div></body>
</html>
